<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protected SSC Master Portal</title>
<style>
  * {
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    margin: 0;
    padding: 0;
    background: #0f172a;
    color: #f8fafc;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .lock-card {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 30px 28px;
    border-radius: 12px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    text-align: center;
  }
  .lock-icon {
    font-size: 36px;
    margin-bottom: 10px;
  }
  .lock-card h2 {
    margin: 0 0 6px 0;
    font-size: 19px;
    color: #fff;
  }
  .lock-card p {
    margin: 0 0 18px 0;
    font-size: 13px;
    color: #94a3b8;
  }
  .lock-card input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #475569;
    border-radius: 7px;
    background: #0f172a;
    color: #fff;
    font-size: 16px;
    text-align: center;
    letter-spacing: 2px;
    margin-bottom: 14px;
    user-select: text;
    -webkit-user-select: text;
  }
  .lock-card input:focus {
    outline: none;
    border-color: #3b82f6;
  }
  .lock-card button {
    width: 100%;
    padding: 11px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.15s;
  }
  .lock-card button:hover {
    background: #1d4ed8;
  }
  .err-msg {
    color: #f87171;
    font-size: 12.5px;
    margin-top: 10px;
    min-height: 18px;
    font-weight: bold;
  }
</style>
</head>
<body oncontextmenu="return false;">

    <button type="submit">Unlock Portal</button>
  </form>
  <div class="err-msg" id="errMsg"></div>
</div>

  function attachAntiCopy(doc) {
    doc.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    doc.addEventListener('keydown', function(e) {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) ||
        (e.ctrlKey && ['u','U','s','S'].includes(e.key))
      ) {
        e.preventDefault();
        return false;
      }
    });
    doc.addEventListener('copy', function(e) {
      const active = doc.activeElement;
      const isEditable = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
      if (!isEditable) {
        e.preventDefault();
      }
    });
    doc.addEventListener('dragstart', function(e) { e.preventDefault(); });
  }

  attachAntiCopy(document);

  window.unlockPortal = function() {
    const pwd = document.getElementById('pwdInput').value;
    const errEl = document.getElementById('errMsg');
    if (!pwd) return;

    try {
      const binStr = atob(_P);
      const encBytes = new Uint8Array(binStr.length);
      for (let i = 0; i < binStr.length; i++) {
        encBytes[i] = binStr.charCodeAt(i);
      }
      const keyBytes = new TextEncoder().encode(pwd);
      const decBytes = new Uint8Array(encBytes.length);
      for (let i = 0; i < encBytes.length; i++) {
        decBytes[i] = encBytes[i] ^ keyBytes[i % keyBytes.length];
      }
      const decodedHtml = new TextDecoder().decode(decBytes);

      if (!decodedHtml.includes('<!DOCTYPE html>') || !decodedHtml.includes('SSC Master Portal')) {
        errEl.textContent = 'Incorrect Password! Please try again.';
        document.getElementById('pwdInput').value = '';
        document.getElementById('pwdInput').focus();
        return;
      }

      const guardScript = `<style>@media screen{body{-webkit-user-select:none;user-select:none;}input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text;}}</style><script>(function(){document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['I','i','J','j','C','c'].includes(e.key))||(e.ctrlKey&&['u','U','s','S'].includes(e.key))){e.preventDefault();return false;}});document.addEventListener('dragstart',e=>e.preventDefault());})();<\/script>`;
      const finalHtml = decodedHtml.replace('</body>', guardScript + '</body>');

      document.open();
      document.write(finalHtml);
      document.close();
    } catch (err) {
      errEl.textContent = 'Incorrect Password! Please try again.';
    }
  };
})();
</script>
